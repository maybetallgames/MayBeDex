<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="MayBeDex — searchable prefab metadata catalog for MayBeTall Games.">
  <title>MayBeDex</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">MayBeTall Games</p>
      <h1>MayBeDex</h1>
      <p class="lede">Search Synty prefab metadata by name, pack, type, component, path, and Unity GUID without loading the private project or image library.</p>
    </div>
    <div class="endpoint-links">
      <a href="./catalog.tsv">catalog.tsv</a>
      <a href="./catalog.json">catalog.json</a>
      <a href="./packs/index.json">packs</a>
      <a href="./version.json">version.json</a>
    </div>
  </header>

  <main>
    <section class="controls" aria-label="Catalog filters">
      <label class="search-wrap">
        <span>Search</span>
        <input id="search" type="search" autocomplete="off" placeholder="robot antenna, FX_Drone_01, weapon, building…">
      </label>
      <label>
        <span>Pack</span>
        <select id="pack"><option value="">All packs</option></select>
      </label>
      <label>
        <span>Kind</span>
        <select id="kind"><option value="">All kinds</option></select>
      </label>
    </section>

    <section class="summary" aria-live="polite">
      <strong id="result-count">Loading catalog…</strong>
      <span id="render-note"></span>
    </section>

    <section id="grid" class="grid" aria-label="Prefab results"></section>
  </main>

  <template id="card-template">
    <article class="card">
      <a class="thumb-link">
        <div class="thumb-shell"><span class="type-mark"></span></div>
        <div class="card-body">
          <h2 class="name"></h2>
          <div class="badges"><span class="kind"></span><span class="pack"></span></div>
          <p class="path"></p>
        </div>
      </a>
    </article>
  </template>

  <script src="./assets/app.js" defer></script>
</body>
</html>
